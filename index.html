    <script>
      (function() {
        // This checks if the URL ends exactly with your folder name OR 
        // if it contains 'offline-bible' but is missing the trailing slash
        var path = window.location.pathname;
        if (path.toLocaleLowerCase().endsWith('/offline-bible')) {
          var newUrl = window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash;
          window.location.replace(newUrl);
        }
      })();
