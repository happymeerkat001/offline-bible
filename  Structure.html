<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible PWA — Data Flow Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c14;
    --grid: rgba(255,255,255,0.03);
    --durable: #3b8eea;
    --control: #f59e0b;
    --mutation: #22c55e;
    --deliver: #a855f7;
    --sustain: #64748b;
    --etl: #eab308;
    --present: #14b8a6;
    --dim: 0.12;
  }

  body {
    background: var(--bg);
    color: #e2e8f0;
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 2rem 2rem 0.5rem;
    text-align: center;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #94a3b8 0%, #e2e8f0 50%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p {
    font-size: 0.72rem;
    color: #475569;
    letter-spacing: 0.15em;
    margin-top: 0.4rem;
    text-transform: uppercase;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1rem 1.6rem;
    padding: 1.2rem 2rem;
    position: relative;
    z-index: 10;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #94a3b8;
    cursor: pointer;
    transition: color 0.2s;
  }

  .legend-item:hover { color: #e2e8f0; }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .diagram-wrap {
    position: relative;
    z-index: 5;
    padding: 1rem 1.5rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  svg.arch-svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .node { cursor: pointer; transition: filter 0.3s; }
  .node .node-bg { transition: opacity 0.3s, filter 0.3s; }
  .node .node-label {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    fill: #e2e8f0;
    transition: opacity 0.3s;
  }
  .node .node-sub {
    font-family: 'Space Mono', monospace;
    font-size: 7.5px;
    fill: rgba(226,232,240,0.5);
    transition: opacity 0.3s;
  }

  .arch-arrow { transition: opacity 0.3s; }
  .sustain-ring { transition: opacity 0.3s; }

  .dimmed .node-bg { opacity: var(--dim) !important; filter: none !important; }
  .dimmed .node-label { opacity: var(--dim) !important; }
  .dimmed .node-sub { opacity: var(--dim) !important; }
  .dimmed.arch-arrow { opacity: var(--dim) !important; }
  .dimmed.sustain-ring { opacity: var(--dim) !important; }

  .file-panel {
    position: fixed;
    top: 50%;
    right: 1.5rem;
    transform: translateY(-50%) translateX(20px);
    width: 280px;
    background: rgba(8,12,20,0.96);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 1.2rem;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    backdrop-filter: blur(12px);
    max-height: 80vh;
    overflow-y: auto;
  }

  .file-panel.visible {
    opacity: 1;
    pointer-events: all;
    transform: translateY(-50%) translateX(0);
  }

  .file-panel-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.8rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .file-item {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .file-item:last-child { border-bottom: none; }

  .file-name {
    font-size: 0.65rem;
    font-family: 'Space Mono', monospace;
    color: #cbd5e1;
    word-break: break-all;
  }

  .file-desc {
    font-size: 0.6rem;
    color: #475569;
    font-family: 'Space Mono', monospace;
    line-height: 1.4;
  }

  .close-panel {
    float: right;
    background: none;
    border: none;
    color: #475569;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0;
    margin-left: 0.5rem;
    transition: color 0.2s;
  }
  .close-panel:hover { color: #e2e8f0; }

  .hint {
    text-align: center;
    font-size: 0.62rem;
    color: #334155;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-bottom: 1rem;
    position: relative;
    z-index: 10;
    animation: pulse-hint 2.5s ease-in-out infinite;
  }

  @keyframes pulse-hint {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @media (max-width: 700px) {
    .file-panel {
      position: fixed;
      top: auto;
      bottom: 0;
      right: 0;
      left: 0;
      width: 100%;
      transform: none;
      border-radius: 12px 12px 0 0;
      max-height: 55vh;
    }
    .file-panel.visible { transform: none; }
  }
</style>
</head>

<script>
const nodeData = {

  control: {

let activeNode = null;

function activateNode(id) {
  if (activeNode === id) { resetAll(); return; }
  activeNode = id;
  document.querySelectorAll('.node, .arch-arrow, .sustain-ring').forEach(el => el.classList.add('dimmed'));
  getRelatedElements(id).forEach(sel => {
    const el = document.querySelector(sel);
    if (el) el.classList.remove('dimmed');
  });
  showPanel(id);
}

function getRelatedElements(id) {
  return {
    durable:  ['#node-durable','#arr-d-c','#lbl-d-c','#arr-d-m','#etl-to-durable','#etl-lbl'],
    control:  ['#node-control','#arr-d-c','#lbl-d-c','#arr-c-m','#lbl-c-m','#arr-c-d','#lbl-c-d','#arr-p-c','#lbl-p-c'],
    mutation: ['#node-mutation','#arr-c-m','#lbl-c-m','#arr-m-d','#lbl-m-d','#arr-d-m'],
    deliver:  ['#node-deliver','#arr-c-d','#lbl-c-d','#arr-m-d','#lbl-m-d','#arr-p-d'],
    sustain:  ['#sustain-ring','#arr-sustain-loop'],
    etl:      ['#node-etl','#etl-chain','#etl-label','#etl-to-durable','#etl-lbl'],
    present:  ['#node-present','#arr-p-c','#lbl-p-c','#arr-p-d'],
  }[id] || [];
}

function resetAll() {
  activeNode = null;
  document.querySelectorAll('.node, .arch-arrow, .sustain-ring').forEach(el => el.classList.remove('dimmed'));
  closePanel();
}

function showPanel(id) {
  const data = nodeData[id];
  const panel = document.getElementById('file-panel');
  document.getElementById('panel-title').textContent = data.label;
  document.getElementById('panel-title').style.color = data.color;
  document.getElementById('panel-files').innerHTML = data.files.map(f =>
    `<div class="file-item">
      <span class="file-name" style="color:${data.color}">${f.name}</span>
      <span class="file-desc">${f.desc}</span>
    </div>`
  ).join('');
  panel.classList.add('visible');
}

function closePanel() {
  document.getElementById('file-panel').classList.remove('visible');
  resetAll();
}

document.querySelector('.diagram-wrap').addEventListener('click', function(e) {
  if (!e.target.closest('.node') && !e.target.closest('.sustain-ring')) resetAll();
});
</script>
